# Cloud builds for SplashCall. Android produces an installable debug APK.
# iOS compiles on a GitHub-hosted Mac. TestFlight runs only when you ask and
# only after the Apple secrets in SETUP.md exist.
name: Mobile builds

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Peer server hostname, optional. Example: signal.example.com'
        required: false
        type: string
      upload_testflight:
        description: 'Also upload an iPhone build to TestFlight (needs Apple secrets)'
        required: false
        type: boolean
        default: false
      cap_server_url:
        description: 'Optional. Website the app should open instead of the packed copy. Leave blank.'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the mobile project files
        run: bash scripts/validate-mobile-config.sh

      - name: Install Android SDK
        run: bash scripts/install-android-sdk.sh

      - name: Build debug APK
        env:
          REACT_APP_BACKEND_URL: ${{ github.event.inputs.backend_url || vars.REACT_APP_BACKEND_URL }}
          REACT_APP_FIRE_API_KEY: ${{ vars.REACT_APP_FIRE_API_KEY }}
          REACT_APP_FIRE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIRE_AUTH_DOMAIN }}
          REACT_APP_FIRE_PROJECT_ID: ${{ vars.REACT_APP_FIRE_PROJECT_ID }}
          REACT_APP_FIRE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIRE_STORAGE_BUCKET }}
          REACT_APP_FIRE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIRE_MESSAGING_SENDER_ID }}
          REACT_APP_FIRE_APP_ID: ${{ vars.REACT_APP_FIRE_APP_ID }}
          REACT_APP_FIRE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIRE_MEASUREMENT_ID }}
          CAP_SERVER_URL: ${{ github.event.inputs.cap_server_url }}
        run: bash scripts/build-android-debug.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplashCall-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the mobile project files
        run: bash scripts/validate-mobile-config.sh

      - name: Build the website and copy it into the iOS app
        env:
          REACT_APP_BACKEND_URL: ${{ github.event.inputs.backend_url || vars.REACT_APP_BACKEND_URL }}
          REACT_APP_FIRE_API_KEY: ${{ vars.REACT_APP_FIRE_API_KEY }}
          REACT_APP_FIRE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIRE_AUTH_DOMAIN }}
          REACT_APP_FIRE_PROJECT_ID: ${{ vars.REACT_APP_FIRE_PROJECT_ID }}
          REACT_APP_FIRE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIRE_STORAGE_BUCKET }}
          REACT_APP_FIRE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIRE_MESSAGING_SENDER_ID }}
          REACT_APP_FIRE_APP_ID: ${{ vars.REACT_APP_FIRE_APP_ID }}
          REACT_APP_FIRE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIRE_MEASUREMENT_ID }}
          CAP_SERVER_URL: ${{ github.event.inputs.cap_server_url }}
        run: |
          pnpm build
          pnpm exec cap sync ios

      - name: Select Xcode 26
        working-directory: .
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install

      - name: Compile for the iPhone simulator
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-testflight:
    name: iOS TestFlight
    needs: ios
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID")
          [ -z "$ASC_KEY_ID" ] && missing+=("ASC_KEY_ID")
          [ -z "$ASC_ISSUER_ID" ] && missing+=("ASC_ISSUER_ID")
          [ -z "$ASC_KEY_P8" ] && missing+=("ASC_KEY_P8")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "These GitHub Actions secrets are not set: ${missing[*]}"
            echo "Create them from a browser. The steps are in SETUP.md. Nothing is installed on your PC."
            exit 1
          fi

      - name: Build the website and copy it into the iOS app
        env:
          REACT_APP_BACKEND_URL: ${{ github.event.inputs.backend_url || vars.REACT_APP_BACKEND_URL }}
          REACT_APP_FIRE_API_KEY: ${{ vars.REACT_APP_FIRE_API_KEY }}
          REACT_APP_FIRE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIRE_AUTH_DOMAIN }}
          REACT_APP_FIRE_PROJECT_ID: ${{ vars.REACT_APP_FIRE_PROJECT_ID }}
          REACT_APP_FIRE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIRE_STORAGE_BUCKET }}
          REACT_APP_FIRE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIRE_MESSAGING_SENDER_ID }}
          REACT_APP_FIRE_APP_ID: ${{ vars.REACT_APP_FIRE_APP_ID }}
          REACT_APP_FIRE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIRE_MEASUREMENT_ID }}
          CAP_SERVER_URL: ${{ github.event.inputs.cap_server_url }}
        run: |
          pnpm build
          pnpm exec cap sync ios

      - name: Select Xcode 26
        working-directory: .
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install CocoaPods
        working-directory: frontend/ios/App
        run: pod install

      - name: Archive, sign, and upload to TestFlight
        working-directory: frontend/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          printf '%s\n' "$ASC_KEY_P8" > "$key_dir/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SplashCall.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -authenticationKeyPath "$key_dir/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/SplashCall.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_dir/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
